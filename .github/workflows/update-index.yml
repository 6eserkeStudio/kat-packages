name: Update R2 Index on Release
on:
  release:
    types: [published]
jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS CLI for R2
        run: |
          aws configure set aws_access_key_id ${{ secrets.R2_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws configure set region auto
      - name: Download current index
        run: |
          aws s3 cp s3://${{ secrets.R2_BUCKET }}/index-official.json index-official.json \
            --endpoint-url ${{ secrets.R2_ENDPOINT }} || echo '[]' > index-official.json
      - name: Process release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ github.event.release.tag_name }}
          REPO=${{ github.repository }}
          ASSET=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' | grep '\.kat$' | head -1)
          if [ -z "$ASSET" ]; then echo "No .kat found"; exit 1; fi
          gh release download "$TAG" --repo "$REPO" --pattern "*.kat" --dir .
          SHA256=$(sha256sum "$ASSET" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$ASSET")
          mkdir -p /tmp/extract
          tar xzf "$ASSET" -C /tmp/extract metadata.json 2>/dev/null || tar xf "$ASSET" -C /tmp/extract metadata.json 2>/dev/null
          if [ ! -f /tmp/extract/metadata.json ]; then
            PKG_NAME=$(echo "$TAG" | sed 's/-[0-9].*//')
            PKG_VERSION=$(echo "$TAG" | sed "s/${PKG_NAME}-//")
            PKG_DESC="Official package"
            PKG_ARCH="x86_64"
            DEPS_JSON="[]"
          else
            PKG_NAME=$(jq -r '.name' /tmp/extract/metadata.json)
            PKG_VERSION=$(jq -r '.version' /tmp/extract/metadata.json)
            PKG_DESC=$(jq -r '.description // "Official package"' /tmp/extract/metadata.json)
            PKG_ARCH=$(jq -r '.arch // "x86_64"' /tmp/extract/metadata.json)
            DEPS_JSON=$(jq '.dependencies // []' /tmp/extract/metadata.json)
          fi
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TAG}/${ASSET}"
          NEW_ENTRY=$(jq -n \
            --arg name "$PKG_NAME" \
            --arg version "$PKG_VERSION" \
            --arg description "$PKG_DESC" \
            --argjson dependencies "$DEPS_JSON" \
            --arg size "$SIZE" \
            --arg download_url "$DOWNLOAD_URL" \
            --arg sha256 "$SHA256" \
            --arg arch "$PKG_ARCH" \
            '{name:$name,version:$version,description:$description,dependencies:$dependencies,size:$size,download_url:$download_url,sha256:$sha256,arch:$arch,repo:"official"}')
          jq --argjson new "$NEW_ENTRY" \
            'map(select(.name != $new.name)) + [$new]' index-official.json > tmp.json && mv tmp.json index-official.json
          echo "Index updated with $PKG_NAME"
      - name: Upload index to R2
        run: |
          aws s3 cp index-official.json s3://${{ secrets.R2_BUCKET }}/index-official.json \
            --endpoint-url ${{ secrets.R2_ENDPOINT }}
